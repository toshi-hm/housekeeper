name: Supabase Type Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  type-check:
    name: DB Type Freshness
    runs-on: ubuntu-latest
    # Skip if the project id is not configured (the access token is checked in
    # the first step below — `secrets` is not available in `if:` expressions).
    if: vars.SUPABASE_PROJECT_ID != ''
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Compare against main rather than the PR base so stacked code-only PRs
      # defer while their parent migration PRs have not reached the hosted DB.
      - name: Detect migration changes
        id: migrations
        env:
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          git fetch origin main --depth=1
          BASE_SHA=$(git merge-base origin/main "$HEAD_SHA")
          if [ -z "$BASE_SHA" ]; then
            echo "::error::Could not find a merge base between origin/main and $HEAD_SHA."
            exit 1
          fi
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- 'supabase/migrations/*.sql'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Unmerged migration files are present relative to the merge base; hosted DB type comparison will run after deployment."
          fi

      # A mismatch already present on main is not caused by a code-only PR.
      # Track generated type changes independently so only that inherited drift
      # can be deferred; PRs that edit the type file still fail on a mismatch.
      - name: Detect generated type changes
        id: types
        env:
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ steps.migrations.outputs.base_sha }}
        run: |
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- src/types/supabase.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # `secrets` cannot be referenced from a job- or step-level `if:`, so the
      # token presence is mapped into an env var first and checked here. Without
      # this, setting only the SUPABASE_PROJECT_ID variable un-gates the job
      # while `supabase gen types` still aborts with "Access token not provided",
      # turning every PR red for a reason unrelated to the PR.
      - name: Check Supabase credentials
        id: creds
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SUPABASE_ACCESS_TOKEN is not set — skipping the DB type drift check. Set the secret to enable it."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Supabase types
        if: steps.creds.outputs.configured == 'true' && steps.migrations.outputs.changed != 'true'
        run: bun run gen:types
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}

      - name: Check for type drift
        if: steps.creds.outputs.configured == 'true' && steps.migrations.outputs.changed != 'true'
        env:
          BASE_SHA: ${{ steps.migrations.outputs.base_sha }}
        run: |
          if ! git diff --quiet src/types/supabase.ts; then
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ "${{ steps.types.outputs.changed }}" = "false" ]; then
              base_types="$RUNNER_TEMP/base-supabase.ts"
              git show "$BASE_SHA:src/types/supabase.ts" > "$base_types"
              if ! diff -q "$base_types" src/types/supabase.ts >/dev/null; then
                echo "::warning::Remote Supabase types differ from the checked-in merge-base types. This PR changes neither migrations nor generated types, so the existing base drift is deferred until the database migrations are deployed."
                diff -u "$base_types" src/types/supabase.ts || true
                exit 0
              fi
            fi
            echo "Supabase TypeScript types are out of sync with the DB schema."
            echo "Run 'bun run gen:types' and commit the result."
            git diff src/types/supabase.ts
            exit 1
          fi

      - name: Defer type freshness check until migrations are deployed
        if: steps.migrations.outputs.changed == 'true'
        run: echo "Skipping hosted DB type comparison; the migration deployment workflow verifies types after applying these migrations."
