name: Supabase Type Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  type-check:
    name: DB Type Freshness
    runs-on: ubuntu-latest
    # Skip if the project id is not configured (the access token is checked in
    # the first step below — `secrets` is not available in `if:` expressions).
    if: vars.SUPABASE_PROJECT_ID != ''
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `secrets` cannot be referenced from a job- or step-level `if:`, so the
      # token presence is mapped into an env var first and checked here. Without
      # this, setting only the SUPABASE_PROJECT_ID variable un-gates the job
      # while `supabase gen types` still aborts with "Access token not provided",
      # turning every PR red for a reason unrelated to the PR.
      - name: Check Supabase credentials
        id: creds
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SUPABASE_ACCESS_TOKEN is not set — skipping the DB type drift check. Set the secret to enable it."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Supabase types
        if: steps.creds.outputs.configured == 'true'
        run: bun run gen:types
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}

      - name: Check for type drift
        if: steps.creds.outputs.configured == 'true'
        run: |
          if ! git diff --quiet src/types/supabase.ts; then
            echo "Supabase TypeScript types are out of sync with the DB schema."
            echo "Run 'bun run gen:types' and commit the result."
            git diff src/types/supabase.ts
            exit 1
          fi
