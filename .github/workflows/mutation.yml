name: Mutation Testing

# #674: coverageAnalysis is "off" (the "command" test runner can't instrument
# per-mutant coverage), so every mutant re-runs the full `bun test` suite.
# With src/hooks + src/lib + src/types mutated, a cold run takes ~3.5h -
# far past the old 75-minute per-PR timeout, so every PR run was silently
# `cancelled` before Stryker ever produced a report. Running that on every
# PR is also not a reasonable use of CI time. Moved to a weekly scheduled
# run (with enough timeout headroom to actually finish) instead of gating
# PRs; `workflow_dispatch` still allows an on-demand run against a specific
# PR for manual investigation.
on:
  schedule:
    - cron: "0 18 * * 0" # 03:00 JST Monday
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: "Pull request number to post the report comment to (optional; only needed for a manual run)"
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: mutation-${{ inputs.pull_request_number || github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    name: Mutation Testing (Stryker)
    runs-on: ubuntu-latest
    # A cold full run currently takes about 3.5 hours on ubuntu-latest since
    # coverageAnalysis is "off". Keep enough headroom for runner variance;
    # successful runs then seed the incremental cache and make subsequent
    # runs substantially faster.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore incremental mutation cache
        uses: actions/cache@v6
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.run_id }}
          restore-keys: |
            stryker-incremental-

      - name: Run Stryker mutation testing
        run: bunx stryker run

      - name: Build mutation report comment
        id: report
        if: always()
        run: |
          {
            echo "comment<<MUTATION_REPORT_EOF"
            bun run mutation:report
            echo "MUTATION_REPORT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Write report to job summary
        if: always()
        run: echo "${{ steps.report.outputs.comment }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload mutation report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-${{ github.run_id }}
          path: reports/mutation/
          retention-days: 30
          if-no-files-found: ignore

      - name: Post or update mutation report comment
        if: always() && inputs.pull_request_number != ''
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: mutation-report
          number: ${{ inputs.pull_request_number }}
          message: ${{ steps.report.outputs.comment }}
