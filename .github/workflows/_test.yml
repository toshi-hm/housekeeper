name: Unit Tests

on:
  workflow_call:
    inputs:
      run_unit:
        description: "Run bun unit tests"
        type: boolean
        default: true
      run_deno:
        description: "Run Deno edge function tests"
        type: boolean
        default: true
      run_pgtap:
        description: "Run pgTAP RLS tests"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test:
    name: Unit Tests
    if: ${{ inputs.run_unit }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test --coverage --coverage-reporter=lcov --coverage-dir=coverage

      # bunfig.toml の root = "./src" により scripts/ 配下のテストは上記で実行されないため別途実行する
      - name: Test (scripts)
        run: bun test ./scripts

      # #1265: PR の変更行カバレッジを算出する（警告のみ。bun の lcov が対象で Deno は未対応）
      - name: Diff coverage (non-blocking)
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        run: bun run scripts/diffCoverage.ts coverage/lcov.info "origin/${{ github.base_ref }}"

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/lcov.info
          retention-days: 1

  deno-test:
    if: ${{ inputs.run_deno }}
    name: Deno Edge Function Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # #1258: 既存の型エラー(deno check)・lint 違反を解消するまでは警告のみ
      # (continue-on-error)。解消後に continue-on-error を外して必須化する。
      # no-import-prefix は URL / jsr: 直 import を前提とする現行構成のため除外。
      - name: Type check Edge Functions (non-blocking)
        continue-on-error: true
        run: |
          deno check $(find supabase/functions -name 'index.ts' | sort)

      - name: Lint Edge Functions (non-blocking)
        continue-on-error: true
        run: |
          deno lint --rules-exclude=no-import-prefix supabase/functions

      - name: Test Edge Functions
        run: |
          deno test --no-check --allow-env=CRON_SECRET,SUPABASE_URL,SUPABASE_ANON_KEY --coverage=coverage/deno $(find supabase/functions -name '*.test.ts' | sort)

  pgtap:
    if: ${{ inputs.run_pgtap }}
    name: RLS Policy Tests (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # #1275: 起動失敗（イメージ取得失敗などのインフラ起因）で CI 全体が赤になり DB マイグレーションの
      # 自動デプロイが止まり続けていた。失敗ログを残しつつ最大3回まで再試行する。
      # マイグレーション SQL のエラーは再試行しても変わらないため、3回失敗したら失敗扱いにする。
      # 失敗原因は public.ecr.aws の "Data limit exceeded"（イメージ pull の転送量上限）だったため、
      # pgTAP に不要なサービス（studio / logflare / edge-runtime 等）を -x で除外して pull 量を減らす。
      # postgres / gotrue(auth スキーマ) / storage-api(storage スキーマ) / postgrest / kong は RLS テストで使うため残す。
      - name: Start local Supabase stack
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if bunx supabase start -x studio,imgproxy,mailpit,edge-runtime,realtime,postgres-meta,logflare,vector 2>&1 | tee supabase-start.log; then
              exit 0
            fi
            echo "::warning::supabase start failed (attempt $attempt/3). Retrying in $((attempt * 20))s..."
            bunx supabase stop --no-backup || true
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          echo "::error::supabase start failed 3 times. Last log lines:"
          tail -n 40 supabase-start.log
          exit 1

      # pg_prove イメージの pull がレート制限等で失敗した場合のみ再試行する（#1175）。
      # pgTAP 自体の失敗（not ok）は再試行しても結果が変わらないので即失敗させる。
      - name: Run pgTAP RLS tests
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if bun run test:db 2>&1 | tee test-db.log; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ] && grep -qE "toomanyrequests|error running container: exit 125|TLS handshake timeout" test-db.log; then
              echo "::warning::pg_prove image pull failed (attempt $attempt/3). Retrying in $((attempt * 20))s..."
              sleep $((attempt * 20))
              continue
            fi
            exit 1
          done

      - name: Stop local Supabase stack
        if: always()
        run: bunx supabase stop --no-backup
