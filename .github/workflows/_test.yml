name: Unit Tests

on:
  workflow_call:
    inputs:
      run_unit:
        description: "Run bun unit tests"
        type: boolean
        default: true
      run_deno:
        description: "Run Deno edge function tests"
        type: boolean
        default: true
      run_pgtap:
        description: "Run pgTAP RLS tests"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test:
    name: Unit Tests
    if: ${{ inputs.run_unit }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test --coverage --coverage-reporter=lcov --coverage-dir=coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/lcov.info
          retention-days: 1

  deno-test:
    if: ${{ inputs.run_deno }}
    name: Deno Edge Function Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test Edge Functions
        run: |
          deno test --no-check --allow-env=CRON_SECRET --coverage=coverage/deno $(find supabase/functions -name '*.test.ts' | sort)

  pgtap:
    if: ${{ inputs.run_pgtap }}
    name: RLS Policy Tests (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start local Supabase stack
        run: bunx supabase start

      # pg_prove イメージの pull がレート制限等で失敗した場合のみ再試行する（#1175）。
      # pgTAP 自体の失敗（not ok）は再試行しても結果が変わらないので即失敗させる。
      - name: Run pgTAP RLS tests
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if bun run test:db 2>&1 | tee test-db.log; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ] && grep -qE "toomanyrequests|error running container: exit 125|TLS handshake timeout" test-db.log; then
              echo "::warning::pg_prove image pull failed (attempt $attempt/3). Retrying in $((attempt * 20))s..."
              sleep $((attempt * 20))
              continue
            fi
            exit 1
          done

      - name: Stop local Supabase stack
        if: always()
        run: bunx supabase stop --no-backup
