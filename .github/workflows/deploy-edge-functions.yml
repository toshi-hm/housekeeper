name: Deploy Supabase Edge Functions

# #1087: main へのマージのたびに supabase/functions/ の変更を検知して自動デプロイし、
# 「コードは main にマージ済みだが Edge Function は本番未デプロイ」というドリフト
# （#934, #1043 と同種の問題）を構造的に防ぐ。db-types.yml と同じ認証情報ハンドリング
# （SUPABASE_ACCESS_TOKEN 未設定時はスキップ）を採用する。

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
  workflow_dispatch:
    inputs:
      function_name:
        description: "デプロイ対象のFunction名（空欄なら全Functionを再デプロイ）"
        required: false
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy changed Edge Functions
    runs-on: ubuntu-latest
    # `secrets` はジョブ/ステップの `if:` から直接参照できないため、db-types.yml と
    # 同様に vars.SUPABASE_PROJECT_ID の有無だけをここでゲートし、
    # SUPABASE_ACCESS_TOKEN の有無は最初のステップで確認する。
    if: vars.SUPABASE_PROJECT_ID != ''
    steps:
      - uses: actions/checkout@v7
        with:
          # push イベントでの差分検出（github.event.before との比較）に必要。
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check Supabase credentials
        id: creds
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SUPABASE_ACCESS_TOKEN is not set — skipping Edge Function deploy. Set the secret to enable it."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine target functions
        if: steps.creds.outputs.configured == 'true'
        id: targets
        run: |
          set -euo pipefail
          cd supabase/functions

          if [ -n "${{ inputs.function_name }}" ]; then
            TARGETS="${{ inputs.function_name }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # 手動実行かつ対象未指定 = 全Function再デプロイ（デプロイ漏れの復旧用）。
            TARGETS=$(find . -maxdepth 1 -mindepth 1 -type d -not -name "_shared" -printf "%f\n" | sort)
          else
            BEFORE="${{ github.event.before }}"
            # 初回push等でbeforeが全ゼロSHAになるケース（このリポジトリでは実質発生
            # しないが、想定外のジョブ失敗を避けるため親コミットにフォールバックする）。
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              BEFORE="${{ github.sha }}~1"
            fi
            CHANGED=$(git diff --name-only --relative "$BEFORE" "${{ github.sha }}" -- . || true)
            if echo "$CHANGED" | grep -q '^_shared/'; then
              # 共有コードの変更は影響範囲が読めないため、安全側に全Functionを再デプロイする。
              TARGETS=$(find . -maxdepth 1 -mindepth 1 -type d -not -name "_shared" -printf "%f\n" | sort)
            else
              TARGETS=$(echo "$CHANGED" | awk -F'/' 'NF>1 {print $1}' | sort -u | grep -v '^_shared$' || true)
            fi
          fi

          if [ -z "$TARGETS" ]; then
            echo "No Edge Function changes detected; nothing to deploy."
            echo "targets=" >> "$GITHUB_OUTPUT"
          else
            echo "Target functions:"
            echo "$TARGETS"
            echo "targets<<EOF" >> "$GITHUB_OUTPUT"
            echo "$TARGETS" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy functions
        if: steps.creds.outputs.configured == 'true' && steps.targets.outputs.targets != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          TARGETS: ${{ steps.targets.outputs.targets }}
        run: |
          set -euo pipefail
          while IFS= read -r fn; do
            [ -z "$fn" ] && continue
            echo "::group::Deploying $fn"
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_ID"
            echo "::endgroup::"
          done <<< "$TARGETS"
