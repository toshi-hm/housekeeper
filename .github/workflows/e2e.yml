name: E2E

# Playwright による E2E テスト (#178 / #350)。
# #664: 以前は `e2e` ラベルが付いたPRでのみ走っており、ラベル付け忘れのPRは
# 一度もE2Eが実行されないままマージされ得た。main へのpush時にも一切実行され
# ていなかった。全PR + main へのpushで常時実行するようにした。

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser (chromium)
        run: bunx playwright install --with-deps chromium

      - name: Run E2E tests
        run: bun run test:e2e

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report/
          retention-days: 7
