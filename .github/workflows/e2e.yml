name: E2E

# Playwright による E2E テスト (#178 / #350)。
# #664: 以前は `e2e` ラベルが付いたPRでのみ走っており、ラベル付け忘れのPRは
# 一度もE2Eが実行されないままマージされ得た。main へのpush時にも一切実行され
# ていなかった。全PR + main へのpushで常時実行するようにした。

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser (chromium)
        run: bunx playwright install --with-deps chromium

      - name: Run E2E tests
        run: bun run test:e2e

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report/
          retention-days: 7

      # #816: playwright.config.ts の json reporter 出力からリトライが
      # 発生した(または最終的に失敗した) specを抽出し、傾向を可視化する。
      - name: Extract flaky spec report
        id: flaky
        if: ${{ !cancelled() }}
        run: |
          {
            echo "comment<<FLAKY_REPORT_EOF"
            bun run report:flaky
            echo "FLAKY_REPORT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post or update flaky spec comment
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.flaky.outputs.comment != '' }}
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: e2e-flaky-report
          message: ${{ steps.flaky.outputs.comment }}

      # 前回の実行でリトライが発生していても、今回無ければ古いレポートを
      # 残さず消す（貼りっぱなしで古い結果を誤読させないため）。
      - name: Remove stale flaky spec comment
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.flaky.outputs.comment == '' }}
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: e2e-flaky-report
          delete: true
