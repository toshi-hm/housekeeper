name: Storybook Checks

# axe-core によるアクセシビリティ回帰自動検出 (#497) と、Storyのスクリーン
# ショットを committed baseline と比較するVisual Regression Testing (#807)。
# 全 .stories.tsx をビルドし、@storybook/test-runner の同一パス
# （.storybook/test-runner.ts の postVisit）で両方をチェックする。
# a11yの既知の違反は .storybook/a11y-baseline.ts でスキップし、新規Story
# 追加分から厳格化する段階導入方針（docs/specs/storybook.md参照）。
# VRTのbaseline画像は .storybook/__image_snapshots__/ にコミットする。
# ビルドを1回にまとめて#835の重複を避けるため、a11yとVRTを別ジョブ/別
# ワークフローに分けず同一ジョブ内で完結させている。

on:
  workflow_call:

permissions:
  contents: read

jobs:
  storybook-checks:
    name: Storybook Checks (a11y + visual regression)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser (chromium)
        run: bunx playwright install --with-deps chromium

      - name: Build Storybook
        run: bun run build-storybook
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: placeholder-anon-key

      - name: Serve Storybook
        run: npx serve storybook-static -l 6006 --no-clipboard &

      - name: Wait for Storybook
        run: npx wait-on http://127.0.0.1:6006

      - name: Run Storybook checks (accessibility + visual regression)
        run: bun run test-storybook -- --ci --url http://127.0.0.1:6006

      # VRT差分（意図しない見た目変更 or 意図的な変更のベースライン未更新）
      # が発生した場合、diff/actual画像をjest-image-snapshotがカレント
      # ディレクトリ直下に書き出すので、レビュー用にアーティファクトとして
      # 保存する（#807）。ベースライン更新方法は docs/specs/storybook.md 参照。
      - name: Upload visual regression diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: vrt-diffs
          path: |
            **/__diff_output__/**
          retention-days: 7
          if-no-files-found: ignore
