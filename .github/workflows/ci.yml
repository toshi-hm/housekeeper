name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  # 変更ファイルから実行すべきジョブを判定する (詳細は _changes.yml)。
  # 各ジョブは `if` でスキップする（workflow 単位の paths フィルタは
  # required check が pending のままになるため使わない）。
  changes:
    uses: ./.github/workflows/_changes.yml

  # format:check が Markdown も対象にするため、quality ジョブ自体は常に実行し、
  # 重い処理 (lint / typecheck / build / Storybook build / i18n / spec drift) だけ条件付きにする。
  quality:
    needs: changes
    uses: ./.github/workflows/_quality.yml
    with:
      run_code: ${{ needs.changes.outputs.app == 'true' }}
      run_storybook: ${{ needs.changes.outputs.storybook == 'true' }}
      run_spec_drift: ${{ needs.changes.outputs.spec == 'true' }}

  test:
    needs: changes
    uses: ./.github/workflows/_test.yml
    with:
      run_unit: ${{ needs.changes.outputs.app == 'true' }}
      run_deno: ${{ needs.changes.outputs.functions == 'true' }}
      run_pgtap: ${{ needs.changes.outputs.db == 'true' }}

  coverage:
    name: Test Coverage
    needs: [changes, test]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.changes.outputs.app == 'true' && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download coverage report
        uses: actions/download-artifact@v8
        with:
          name: coverage-report
          path: coverage

      - name: Parse coverage and build comment
        id: parse
        run: |
          LF=$(grep "^LF:"  coverage/lcov.info | awk -F: '{sum+=$2} END {print sum+0}')
          LH=$(grep "^LH:"  coverage/lcov.info | awk -F: '{sum+=$2} END {print sum+0}')
          FNF=$(grep "^FNF:" coverage/lcov.info | awk -F: '{sum+=$2} END {print sum+0}')
          FNH=$(grep "^FNH:" coverage/lcov.info | awk -F: '{sum+=$2} END {print sum+0}')
          BRF=$(grep "^BRF:" coverage/lcov.info | awk -F: '{sum+=$2} END {print sum+0}')
          BRH=$(grep "^BRH:" coverage/lcov.info | awk -F: '{sum+=$2} END {print sum+0}')

          line_pct=$([ "$LF"  -gt 0 ] && echo "scale=1; $LH  * 100 / $LF"  | bc || echo "0")
          func_pct=$([ "$FNF" -gt 0 ] && echo "scale=1; $FNH * 100 / $FNF" | bc || echo "0")
          branch_pct=$([ "$BRF" -gt 0 ] && echo "scale=1; $BRH * 100 / $BRF" | bc || echo "0")

          {
            echo "comment<<COMMENT_EOF"
            echo "## Coverage Report"
            echo ""
            echo "| Metric | Covered | Total | % |"
            echo "|--------|---------|-------|---|"
            echo "| Lines | $LH | $LF | ${line_pct}% |"
            echo "| Functions | $FNH | $FNF | ${func_pct}% |"
            echo "| Branches | $BRH | $BRF | ${branch_pct}% |"
            echo "COMMENT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post or update coverage comment
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: coverage-report
          message: ${{ steps.parse.outputs.comment }}

  audit:
    needs: changes
    if: ${{ needs.changes.outputs.deps == 'true' }}
    uses: ./.github/workflows/_audit.yml

  # 秘匿情報とコミットメッセージは変更内容に関わらず常に検査する
  secret-scan:
    uses: ./.github/workflows/_secret-scan.yml

  knip:
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' }}
    uses: ./.github/workflows/_knip.yml

  commitlint:
    uses: ./.github/workflows/_commitlint.yml
    with:
      base_sha: ${{ github.event.pull_request.base.sha }}

  lighthouse:
    needs: changes
    if: ${{ needs.changes.outputs.bundle == 'true' }}
    uses: ./.github/workflows/_lighthouse.yml

  a11y:
    needs: [changes, quality]
    if: ${{ needs.changes.outputs.storybook == 'true' }}
    uses: ./.github/workflows/_a11y.yml
