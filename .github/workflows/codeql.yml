name: CodeQL

# #836: static analysis (SAST) for the app's JS/TS source. Runs on every PR
# into main plus a weekly schedule so drift between scans is bounded even on
# weeks with no PRs.
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1" # 12:00 JST Monday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
